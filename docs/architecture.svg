  <rect x="766" y="74" width="384" height="78" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
  <text x="782" y="100" font-size="13" font-weight="500" fill="#042C53" dominant-baseline="central">③ 桌面胶囊 · float.html + float.tsx</text>
  <text x="782" y="120" font-size="12" fill="#185FA5" dominant-baseline="central">无框透明常驻窗，拖动落盘位置</text>
  <text x="782" y="138" font-size="12" fill="#185FA5" dominant-baseline="central">单击展开卡片；同一份 Snapshot</text>
</g>

