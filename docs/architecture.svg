<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 990" role="img" font-family="system-ui, 'Segoe UI', 'Microsoft YaHei', sans-serif">
<title>wb-token-meter 分层架构图</title>
<desc>从外部数据源到渲染层的五层结构：外部磁盘与网络、八个采集器、shared 纯函数层、主进程编排与服务、preload 桥、三个渲染出口。</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<text x="24" y="26" font-size="16" font-weight="500" fill="#2C2C2A">wb-token-meter 系统架构（v0.10.0 · Electron 主进程 + 两渲染进程）</text>

<rect x="24" y="40" width="1126" height="26" rx="6" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.5"/>
<text x="38" y="53" font-size="12" font-weight="500" fill="#042C53" dominant-baseline="central">(1) 渲染层 · 两个 Chromium 渲染进程 + 一个系统托盘</text>

<g>
  <rect x="24" y="74" width="330" height="78" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
  <text x="40" y="100" font-size="13" font-weight="500" fill="#042C53" dominant-baseline="central">① 系统托盘（主进程直出）</text>
  <text x="40" y="120" font-size="12" fill="#185FA5" dominant-baseline="central">TrayController：11 帧进度环</text>
  <text x="40" y="138" font-size="12" fill="#185FA5" dominant-baseline="central">四组子菜单（数据源/外观/胶囊/更新）</text>
</g>
<g>
  <rect x="370" y="74" width="380" height="78" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
  <text x="386" y="100" font-size="13" font-weight="500" fill="#042C53" dominant-baseline="central">② 主面板 · index.html + App.tsx</text>
  <text x="386" y="120" font-size="12" fill="#185FA5" dominant-baseline="central">560×900，关窗即隐藏</text>
  <text x="386" y="138" font-size="12" fill="#185FA5" dominant-baseline="central">React 19 + 手写 SVG 仪表 / 热力图 / 趋势</text>
</g>
